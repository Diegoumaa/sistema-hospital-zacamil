server:
  port: 8083

spring:
  application:
    name: consultas-cama-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/a9a9a395-9ee3-4b10-b45d-53bfd77c7d72/v2.0
          audiences: api://32157fa3-8fb6-4872-9309-d04ebfeee376
  cloud:
    function:
      definition: procesarAltaMedica;procesarCamaLimpia
    azure:
      cosmos:
        endpoint: ${COSMOS_ENDPOINT:https://localhost:8081}
        key: ${COSMOS_KEY:C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
        database: ZacamilReadDB
        populate-query-metrics: true
      servicebus:
        connection-string: Endpoint=sb://bus-zacamil-std.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=${AZURE_SB_KEY}
    stream:
      bindings:
        procesarAltaMedica-in-0:
          destination: altas-topic
          group: consultas-sub
        procesarCamaLimpia-in-0:
          destination: camas-disponibles-topic
          group: consultas-sub
      servicebus:
        bindings:
          procesarAltaMedica-in-0:
            consumer:
              auto-complete: true
          procesarCamaLimpia-in-0:
            consumer:
              auto-complete: true